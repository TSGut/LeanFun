book_texts = ["[Closed Jacobi weight characterisation] For $\\alpha,\\beta\\ge0$, the weight $\\overline w_{\\alpha,\\beta}$ agrees with $w_{\\alpha,\\beta}$ on $(-1,1)$, and \\[\\overline w_{\\alpha,\\beta}(1)=\\begin{cases}2^\\beta&\\alpha=0,\\\\0&\\alpha>0,\\end{cases} \\qquad \\overline w_{\\alpha,\\beta}(-1)=\\begin{cases}2^\\alpha&\\beta=0,\\\\0&\\beta>0.\\end{cases}\\]"]

