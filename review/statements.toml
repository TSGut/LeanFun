book_nodes = ["def:gamma-function"]
book_texts = ["[Gamma on its classical domain] Let $D=\\mathbb C\\setminus\\{0,-1,-2,\\ldots\\}$. For $z\\in D$, let $N=\\lfloor\\max(1-\\Re z,0)\\rfloor$ and define \\[ \\Gamma(z)=\\frac{1}{(z)_N}\\int_0^\\infty e^{-t}t^{z+N-1}\\,dt, \\] where $t$ ranges over the strictly positive reals and the power uses the real logarithm of $t$. The real Gamma function is its restriction to $\\mathbb R\\setminus\\{0,-1,-2,\\ldots\\}$. Gamma has no assigned value at a pole. Reference: \\cite[5.2.1, 5.5.1]{dlmf}."]

