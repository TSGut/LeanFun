book_nodes = ["thm:gegenbauer-measure-bridge"]
book_texts = ["[Gegenbauer--Jacobi measure bridge] For every real $\\lambda$, the Gegenbauer weight equals $w_{\\lambda-1/2,\\lambda-1/2}$ on $(-1,1)$, and $\\mu_\\lambda=\\mu_{\\lambda-1/2,\\lambda-1/2}$. The measure assigns zero mass to $\\mathbb{R}\\setminus(-1,1)$. Reference: \\cite[Table 18.3.1]{dlmf}."]

