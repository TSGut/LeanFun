book_nodes = ["thm:gegenbauer-degree"]
book_texts = ["[Gegenbauer degree and leading term] Let $R$ be a commutative $\\Q$-algebra, let $\\lambda\\in R$, and let $n\\in\\N$. The Gegenbauer polynomial $C_n^{(\\lambda)}(X)$ has degree at most $n$, and its coefficient of $X^n$ is \\[ c_n=\\frac{2^n(\\lambda)_n}{n!}. \\] It has degree exactly $n$ if and only if $c_n\\ne0$. In that case, its leading coefficient is $c_n$. Reference: \\cite[Table 18.3.1]{dlmf}."]

