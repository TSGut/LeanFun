book_nodes = ["def:gegenbauer-measure"]
book_texts = ["[Gegenbauer measure] For real $\\lambda$, let $w_\\lambda=w_{\\lambda-1/2,\\lambda-1/2}:(-1,1)\\to\\R_{\\ge0}$ be the Jacobi weight of Definition~\\ref{def:jacobi-measure}, and let $\\mu_\\lambda=\\mu_{w_\\lambda}$ be the measure of Definition~\\ref{def:open-interval-weight-measure}. Reference: \\cite[Table 18.3.1]{dlmf}."]

