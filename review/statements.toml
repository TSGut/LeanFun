book_nodes = ["thm:jacobi-ode"]
book_texts = ["[Jacobi differential equation] Let $R$ be a commutative $\\Q$-algebra, let $\\alpha,\\beta\\in R$, and let $n\\in\\N$. The Jacobi polynomial $y=P_n^{(\\alpha,\\beta)}(X)$ satisfies \\[(1-X^2)y''+[\\beta-\\alpha-(\\alpha+\\beta+2)X]y' +n(n+\\alpha+\\beta+1)y=0.\\] Reference: \\cite[Table 18.8.1]{dlmf}."]

