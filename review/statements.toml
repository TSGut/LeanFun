book_nodes = ["thm:gegenbauer-measure-characterisation"]
book_texts = ["[Gegenbauer density and integral characterisation] For every $x\\in(-1,1)$, $w_\\lambda(x)=(1-x^2)^{\\lambda-1/2}$. A real function $f$ is $\\mu_\\lambda$-integrable if and only if $w_\\lambda f$ is integrable on the open interval. When these equivalent integrability conditions hold, \\[ \\int f\\,d\\mu_\\lambda=\\int_{x\\in(-1,1)}w_\\lambda(x)f(x)\\,dx. \\] Reference: \\cite[Table 18.3.1]{dlmf}."]

