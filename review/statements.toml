book_nodes = ["def:jacobi"]
book_texts = ["[Jacobi polynomials] For a commutative $\\Q$-algebra $R$, $\\alpha,\\beta\\in R$, and $n\\in\\N$, define \\[P_n^{(\\alpha,\\beta)}(X)=\\sum_{\\ell=0}^n \\frac{(n+\\alpha+\\beta+1)_\\ell(\\alpha+\\ell+1)_{n-\\ell}} {\\ell!(n-\\ell)!2^\\ell}(X-1)^\\ell.\\] Reference: \\cite[18.5.7]{dlmf}."]

