book_nodes = ["thm:jacobi-values"]
book_texts = ["[Special values and symmetry] Let $R$ be a commutative $\\Q$-algebra, let $\\alpha,\\beta\\in R$, and let $n\\in\\N$. The Jacobi polynomials satisfy \\[P_n^{(\\alpha,\\beta)}(-X)=(-1)^nP_n^{(\\beta,\\alpha)}(X),\\qquad P_n^{(\\alpha,\\beta)}(-1)=(-1)^n\\frac{(\\beta+1)_n}{n!}.\\] Reference: \\cite[Table 18.6.1]{dlmf}."]

