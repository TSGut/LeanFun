book_nodes = ["def:gegenbauer"]
book_texts = ["[Gegenbauer polynomials] Gegenbauer polynomials are also called \\emph{ultraspherical polynomials}; see \\cite[\\S18.1(ii)]{dlmf}. Let $R$ be a commutative $\\Q$-algebra, let $\\lambda\\in R$, and let $n\\in\\N$. Define \\[C_n^{(\\lambda)}(X)=\\sum_{k=0}^{\\lfloor n/2\\rfloor} \\frac{(-1)^k(\\lambda)_{n-k}}{k!(n-2k)!}(2X)^{n-2k}.\\] Reference: \\cite[18.5.10]{dlmf}."]

