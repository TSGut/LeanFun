book_nodes = ["thm:jacobi-low-degree"]
book_texts = ["[Low degrees and parameter substitution] For a commutative $\\Q$-algebra $R$ and $\\alpha,\\beta\\in R$, \\[P_0^{(\\alpha,\\beta)}=1,\\qquad P_1^{(\\alpha,\\beta)}=(\\alpha+1)+\\tfrac12(\\alpha+\\beta+2)(X-1).\\] For every $\\Q$-algebra homomorphism $f:R\\to S$ and $n\\in\\N$, applying $f$ to the coefficients of $P_n^{(\\alpha,\\beta)}$ gives $P_n^{(f(\\alpha),f(\\beta))}$. Reference: \\cite[18.5.7]{dlmf}."]

