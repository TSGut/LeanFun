book_texts = ["[Jacobi value at one] Let $R$ be a commutative $\\Q$-algebra, let $\\alpha,\\beta\\in R$, and let $n\\in\\N$. Then $P_n^{(\\alpha,\\beta)}(1)=(\\alpha+1)_n/n!$. In particular, $(n+1)P_{n+1}^{(\\alpha,\\beta)}(1)=(n+\\alpha+1)P_n^{(\\alpha,\\beta)}(1)$. Reference: \\cite[Table 18.6.1]{dlmf}."]

