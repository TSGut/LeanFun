book_nodes = ["def:open-domain-analytic"]
book_texts = ["[Analyticity on an open domain] Let $\\mathbb K$ be a nontrivially normed field (for example $\\mathbb R$ or $\\mathbb C$), let $U\\subseteq\\mathbb K$ be open, and let $f:U\\to\\mathbb K$. We call $f$ analytic on $U$ if, for every $x\\in U$, there exist a function $F:\\mathbb K\\to\\mathbb K$, coefficients $a_n\\in\\mathbb K$ for $n\\in\\mathbb N$, and $r\\in(0,\\infty]$ such that: \\begin{enumerate} \\item $F(y)=f(y)$ for every $y\\in U$; \\item $r\\le R$, where the supremum is taken in $[0,\\infty]$ and \\[ R=\\sup\\left\\{s\\ge0:\\ \\exists C\\in\\mathbb R,\\quad \\|a_n\\|s^n\\le C\\text{ for every }n\\in\\mathbb N\\right\\}; \\] \\item for every $h\\in\\mathbb K$ with $\\|h\\|<r$, the partial sums \\[ \\sum_{n=0}^{N-1}a_nh^n \\] converge to $F(x+h)$ as $N\\to\\infty$. \\end{enumerate}"]

