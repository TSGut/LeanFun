book_nodes = ["thm:jacobi-weight-calculus"]
book_texts = ["[Jacobi weight calculus] On $(-1,1)$, for arbitrary real $\\alpha,\\beta$, \\[w_{\\alpha+1,\\beta+1}=(1-x^2)w_{\\alpha,\\beta},\\qquad w_{\\alpha+1,\\beta+1}'=[\\beta-\\alpha-(\\alpha+\\beta+2)x]w_{\\alpha,\\beta}.\\] If $\\alpha>-1$, the right endpoint limit of the shifted weight is zero, with no restriction on $\\beta$. If $\\beta>-1$, its left endpoint limit is zero, with no restriction on $\\alpha$. Reference: \\cite[Tables 18.3.1 and 18.8.1]{dlmf}."]

