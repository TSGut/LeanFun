book_nodes = ["def:open-domain-derivative"]
book_texts = ["[Derivatives on open domains] Let $\\mathbb K$ be a nontrivially normed field (for example $\\mathbb R$ or $\\mathbb C$). Let $U\\subseteq\\mathbb K$ be open, $f:U\\to\\mathbb K$, $x\\in U$ and $d\\in\\mathbb K$. Say that $f$ has derivative $d$ at $x$ if there exists $F:\\mathbb K\\to\\mathbb K$ agreeing with $f$ on $U$ such that $F'(x)$ exists and equals $d$."]

