name = "LeanFun"
version = "0.1.0"
defaultTargets = ["LeanFun"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "ade5dcd9754acef23d0e35968bff5c0c0c8acc76"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "3d425859e73fcfbef85b9638c2a91708ef4a22d4"

[[lean_lib]]
name = "LeanFun"

[[lean_exe]]
name = "review_fingerprint"
root = "review.Fingerprint"
supportInterpreter = true

[[lean_lib]]
name = "ReviewTests"
srcDir = "test"
roots = ["ReviewTests.Fixture", "ReviewTests.Public"]

[[lean_exe]]
name = "revolver_signatures"
root = "scripts.RevolverSignatures"
supportInterpreter = true
